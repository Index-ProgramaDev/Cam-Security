# Camera settings
# Para usar um vídeo em vez de webcam, deixe video_path apontando para um arquivo .mp4/.avi
video_path: "./config/luta.mp4"
camera_id: 0
# Resolução 640x480 garante crops grandes o suficiente para o MediaPipe Pose
width: 640
height: 480
# Fallback se o arquivo não reportar FPS válido; o playback usa o FPS real do vídeo.
fps: 30
use_synthetic: false
